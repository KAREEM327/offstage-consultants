<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#CC44DD"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0F1628"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(0,212,255,0.05)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(0,212,255,0.05)" stroke-width="1"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>

  <!-- Left accent -->
  <rect x="80" y="160" width="4" height="220" fill="url(#brand)"/>

  <!-- Main text -->
  <text x="110" y="240" font-family="sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">OFFSTAGE AI</text>

  <!-- Tagline gradient -->
  <text x="110" y="300" font-family="sans-serif" font-size="24" font-weight="600" fill="url(#brand)" letter-spacing="3">INTELLIGENT WORKFORCE, UNSEEN</text>

  <!-- Description -->
  <text x="110" y="360" font-family="sans-serif" font-size="20" fill="#8899bb">AI strategy &amp; implementation for small businesses and founders.</text>
  <text x="110" y="390" font-family="sans-serif" font-size="20" fill="#8899bb">Custom tools. Operational systems. Real results.</text>

  <!-- URL pill -->
  <rect x="110" y="430" width="240" height="44" rx="4" fill="none" stroke="url(#brand)" stroke-width="1.5"/>
  <text x="230" y="458" font-family="sans-serif" font-size="16" fill="#00D4FF" text-anchor="middle" letter-spacing="1">offstageai.com</text>

  <!-- Bottom right logo mark -->
  <text x="1080" y="580" font-family="sans-serif" font-size="48" font-weight="900" fill="url(#brand)" opacity="0.2">OA</text>
</svg>
